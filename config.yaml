# ============================================================================
#  Indice de setups de avaliacao.
#
#  Cada setup e um arquivo em configs/<recorte>.yaml com o bloco de configuracao
#  (dataset, slicing, crossfolds, inference) e a lista de models a avaliar.
#
#  Contrato de saida (fixo): a avaliacao grava por modelo em
#    results/<recorte>/<modelo>/fold_N/   (visualizacoes)
#  e o rotulo no CSV e <RECORTE>_<MODELO> (ex. ASAHI_RECT_YOLOV8L). O <recorte>
#  vem do nome da pasta em dataset.output_path.
#
#  Para avaliar outro modelo, edite 'models' no configs/<recorte>.yaml
#  correspondente (ex. models: [YOLOV8L]) — nao crie um setup novo por modelo.
#
#  setups_to_run seleciona QUAIS recortes rodam.
# ============================================================================

paths:
  source_dataset: ./dataset/all
  generated_datasets: ./output
  models: ./models
  results: ./results

# Recortes (campo 'name' abaixo) a executar em geraResultados.py.
setups_to_run:
  - asahi_rect
  - sahi
  - asahi
  - all_640

# Catalogo de recortes disponiveis. Adicione novos aqui + um arquivo em configs/.
setups:
  - name: sahi
    config: configs/sahi.yaml
  - name: asahi
    config: configs/asahi.yaml
  - name: asahi_rect
    config: configs/asahi_rect.yaml
  - name: all_640
    config: configs/all_640.yaml
