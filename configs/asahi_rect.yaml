# Setup: ASAHI retangular (tile adaptativo por eixo)

dataset:
  input_path: ./dataset/all
  output_path: ./dataset/asahi_rect

slicing:
  mode: asahi_rect
  tile_size: [640, 640]
  overlap_ratio: 0.15

crossfolds:
  n_folds: 5
  seed: 42
  ioa_threshold: 0.4
  split_strategy: kfold_holdout
  val_ratio: 0.15
  empty_tile_ratio: 0.08

inference:
  suppression: cluster_diou_nms
  conf_threshold: 0.5
  iou_threshold: 0.5
  batch_size: 32

# Modelos a avaliar. Nome livre: o prefixo define o engine (YOLO* -> YOLO
# Ultralytics, FASTER -> faster_rcnn, DETR -> detr) e tambem o nome da pasta de
# pesos em pesos/asahi_rect/model_checkpoints/fold_N/<modelo>/.
models: [YOLOV8L]
